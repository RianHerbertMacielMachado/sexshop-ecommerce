# ============================================================
# Railway Configuration — Monorepo com 2 serviços
#
# COMO USAR NO RAILWAY:
# 1. Crie um projeto no Railway
# 2. Adicione um serviço PostgreSQL (clique em + New > Database > PostgreSQL)
# 3. Adicione o serviço API:
#    - Source: GitHub repo, Root Directory: /
#    - Dockerfile Path: apps/api/Dockerfile
#    - Configure as variáveis de ambiente listadas em .env.example.api
# 4. Adicione o serviço WEB:
#    - Source: GitHub repo, Root Directory: /
#    - Dockerfile Path: apps/web/Dockerfile
#    - Configure as variáveis de ambiente listadas em .env.example.web
# 5. No serviço API, adicione o comando de release:
#    npx prisma migrate deploy
# ============================================================

[build]
  builder = "DOCKERFILE"
