# ============================================================
# Railway Configuration — Monorepo com 2 serviços
# ============================================================

[build]
  builder = "DOCKERFILE"

# ============================================================
# SERVIÇO: API (Backend Node.js)
# ============================================================
[[services]]
  name = "api"
  source = "apps/api"

  [services.build]
    dockerfilePath = "apps/api/Dockerfile"

  [services.deploy]
    startCommand = "node dist/server.js"
    healthcheckPath = "/health"
    healthcheckTimeout = 30
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 3

  [[services.variables]]
    name = "NODE_ENV"
    value = "production"

  [[services.variables]]
    name = "PORT"
    value = "3001"

# ============================================================
# SERVIÇO: WEB (Frontend Next.js)
# ============================================================
[[services]]
  name = "web"
  source = "apps/web"

  [services.build]
    dockerfilePath = "apps/web/Dockerfile"

  [services.deploy]
    startCommand = "node server.js"
    healthcheckPath = "/"
    healthcheckTimeout = 30
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 3

  [[services.variables]]
    name = "NODE_ENV"
    value = "production"

  [[services.variables]]
    name = "PORT"
    value = "3000"
